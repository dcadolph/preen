name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Keyless signing and build provenance: the job's OIDC token mints the short-lived signing
  # certificate, and the attestation is stored against this repository.
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The Claude Code plugin reports its own version, which nothing else
      # updates. Stop before building anything when it disagrees with the tag.
      - name: Check the plugin version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "$got" != "$want" ]; then
            echo "::error::.claude-plugin/plugin.json says $got but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      # goreleaser runs after the tag push that created the release, and it
      # resets the release name to the bare tag. Remember the title first so
      # the descriptive one can be put back.
      - name: Remember the release title
        id: title
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="$(gh release view "$GITHUB_REF_NAME" --json name --jq .name 2>/dev/null || true)"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # One keyless signature over checksums.txt covers every archive through its checksum.
      # Self-verified immediately with the same identity check a downloader would run, so a
      # release cannot ship a signature its own instructions would reject.
      - name: Sign the checksums
        run: |
          set -euo pipefail
          cd dist
          for i in 1 2 3; do
            if cosign sign-blob --yes checksums.txt \
                --output-signature checksums.txt.sig \
                --output-certificate checksums.txt.pem; then
              break
            fi
            if [ "$i" = 3 ]; then exit 1; fi
            sleep 15
          done
          cosign verify-blob checksums.txt \
            --signature checksums.txt.sig \
            --certificate checksums.txt.pem \
            --certificate-identity-regexp '^https://github.com/dcadolph/preen/\.github/workflows/release\.yml@refs/tags/v' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum -c checksums.txt

      - name: Attach the signature to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/checksums.txt.sig dist/checksums.txt.pem --clobber

      # SLSA build provenance for every published archive, checkable with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Restore the release title
        if: steps.title.outputs.name != '' && steps.title.outputs.name != github.ref_name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --title "${{ steps.title.outputs.name }}"
